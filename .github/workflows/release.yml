# A pushed v* tag on main (npm version patch; git push --follow-tags) builds the Windows installer and leaves a draft
# GitHub release with every file in it. Publishing is manual: installed copies update from releases/latest
# (src/main/app/updater.ts), which skips drafts and pre-releases, so publish it as a full release marked latest.
# Pull requests are checked by ci.yml (lint, typecheck, tests); this is the only release pipeline.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write # GITHUB_TOKEN drafts the release and uploads the assets
jobs:
  release:
    runs-on: windows-latest
    env:
      BS_BUNDLE_ENGINE: ${{ vars.BS_BUNDLE_ENGINE || 'false' }}
    steps:
      # Avoid Windows short-path aliases in filesystem and Git integration checks. Set through GITHUB_ENV because the
      # runner context isn't allowed in job-level env.
      - name: Use runner temp
        shell: bash
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Tag triggers can't filter by branch; behind/identical means the tagged commit is already in main
      - name: Tag is on main
        shell: powershell
        run: |
          $status = gh api "repos/$env:GITHUB_REPOSITORY/compare/main...$env:GITHUB_SHA" --jq .status
          if ($status -notin 'identical', 'behind') { throw "$env:GITHUB_REF_NAME is not on main ($status)" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # electron-builder publishes to v<package.json version>; a different tag would release the wrong thing
      - name: Tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - uses: actions/setup-python@v5
        with:
          # Used only to run scripts/build-runtime.py; the pinned engine brings its own Python runtime.
          python-version: '3.14'
          architecture: x64
      - name: Assemble published pinned engine runtime
        run: |
          if (!$env:GH_TOKEN) { throw 'BS_ENGINE_TOKEN is required for private engine downloads' }
          python scripts/build-runtime.py --require-published
        env:
          GH_TOKEN: ${{ secrets.BS_ENGINE_TOKEN }}
      # one draft up front: electron-builder uploads the exe and the blockmap in parallel, and with no release yet
      # each upload created its own (v1.0.1 and v1.0.2 came out twice, files split between them)
      - name: Draft release
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
        env:
          BS_ENGINE_PYTHON: ${{ github.workspace }}/out/runtime/engine/runtime/python.exe
      # the acceptance test needs only out/runtime, so it runs while the app builds, packs and uploads; the release
      # stays a draft until both pass. Not --prepackaged: that skips afterPack, which writes app-update.yml.
      - name: Upload installer to the draft while verifying real runtime activation and fallbacks
        shell: bash
        run: |
          npx vitest run src/main/runtime/runtime-integration.test.ts > "$RUNNER_TEMP/acceptance.log" 2>&1 &
          acceptance=$!
          built=0; npm run release || built=$?
          tested=0; wait $acceptance || tested=$?
          cat "$RUNNER_TEMP/acceptance.log"
          test $built -eq 0 && test $tested -eq 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BS_RUNTIME_CHECK: '1'
          BS_BROWSER_CHECK: '1'
          BS_ACCEPTANCE_ROOT: ${{ github.workspace }}/out/acceptance
      - name: Verify packaged files and runtime artifact integrity
        run: node scripts/check-package.mts
      - name: Upload runtime to the draft
        shell: powershell
        run: |
          $engineAsset = (Get-Content -Raw out/runtime/runtime-manifest.json | ConvertFrom-Json).engine.asset
          if (!$engineAsset) { throw 'Missing engine.asset in out/runtime/runtime-manifest.json' }
          $runtimeAssets = @('out/runtime/runtime-manifest.json', 'out/runtime/SHA256SUMS', (Resolve-Path -LiteralPath (Join-Path out/runtime $engineAsset)).Path)
          gh release upload $env:GITHUB_REF_NAME @runtimeAssets --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # installs read latest.yml from the latest release; fail the run rather than leave a draft that lacks it or names
      # another version
      - name: Update metadata matches the tag
        shell: bash
        run: |
          gh release download "$GITHUB_REF_NAME" -p latest.yml -O - | grep -qx "version: ${GITHUB_REF_NAME#v}[[:space:]]*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
