name: Bug report
description: Report a crash, incorrect 3D rendering, export issue, or unexpected behavior
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search existing issues first to avoid duplicates.
        For security vulnerabilities, use our private reporting flow described in `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps to trigger the issue.
      placeholder: |
        1. Open a build targeting Minecraft 26.3
        2. Switch to Editor -> Fill tool
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Builder Studio version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: mc_version
    attributes:
      label: Minecraft Java version
      placeholder: e.g. 26.3, 1.21.4
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2 x64
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report or logs (optional)
      description: You can copy a diagnostics report from Settings -> Advanced -> Diagnostics -> Copy report. Remove any personal paths or secrets before pasting.
      render: text
